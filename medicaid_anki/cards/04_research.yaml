deck: "Medicaid::4. Research: Efficacy & Reform"
deck_id: 2059400114
default_priority: 2
tags: [medicaid, research]

# ---------------------------------------------------------------------------
# Each study card gives design, headline finding, and the caveat that a
# careful reader would raise. Effect sizes are rounded to what is worth
# remembering; go to the paper before quoting a number in writing. Where a
# precise figure is stated approximately, that is deliberate.
# ---------------------------------------------------------------------------

cards:

  # --- Methods -------------------------------------------------------------

  - id: R001
    priority: 1
    tags: [methods]
    front: |-
      Why is the naive comparison of Medicaid enrollees to the uninsured useless?
    back: |-
      Selection. People on Medicaid are poorer, sicker, and more disabled than the uninsured by construction — disability is itself an eligibility pathway, and sick people enroll when they get sick. Raw comparisons make Medicaid look harmful.
    extra: |-
      Every credible study in this deck exists to break that selection. Whenever you see a claim that "Medicaid enrollees have worse outcomes than the uninsured," the first question is what generated the variation in coverage.

  - id: R002
    priority: 1
    tags: [methods]
    front: |-
      What are the main identification strategies used in the Medicaid literature?
    back: |-
      - <b>Randomization</b> — the Oregon lottery; the IRS letter experiment
      - <b>Difference-in-differences</b> — state expansions against non-expanding states
      - <b>Regression discontinuity</b> — birthdate cutoffs in eligibility rules; income thresholds
      - <b>Simulated instruments</b> — Currie-Gruber, using legislated eligibility rules applied to a fixed national sample
      - <b>Policy reversals</b> — the 2005 TennCare disenrollment
      - <b>Random plan assignment</b> — auto-assignment algorithms in managed care
    extra: |-
      Knowing which strategy produced a result tells you what population it applies to. The lottery identifies effects for low-income adults who actively sought coverage; expansion DiD identifies effects for the whole newly eligible population, most of whom did not.

  - id: R003
    priority: 3
    tags: [methods]
    front: |-
      What is a "simulated eligibility instrument," and why was it a breakthrough?
    back: |-
      Currie and Gruber's device: take a fixed national sample of children (or women), apply each state-year's legislated eligibility rules to it, and use the resulting fraction eligible as an instrument for individual eligibility.
    extra: |-
      It isolates variation coming from <i>legislation</i> rather than from a state's population composition or economy. Without it, states that expanded eligibility would appear to have more eligible people simply because they had more poor people. It remains the standard tool in the eligibility-expansion literature.

  - id: R004
    tags: [methods]
    front: |-
      What is the difference between an intent-to-treat effect and a local average treatment effect here?
    back: |-
      In the Oregon lottery, <b>ITT</b> is the effect of <i>winning the lottery</i> — but only about a quarter of winners ended up enrolled. <b>LATE</b> scales that up to the effect of <i>actually having Medicaid</i> for those induced to enroll by winning, by instrumenting coverage with lottery selection.
    extra: |-
      Reported Oregon effects are usually LATE. This matters when comparing to expansion studies, which often report ITT-style effects on whole populations, and it matters for the power discussion — the ITT is small because most of the treatment group was untreated.

  - id: R005
    priority: 1
    tags: [methods, power]
    front: |-
      What is the statistical power critique of the Oregon two-year health results?
    back: |-
      The confidence intervals on blood pressure, cholesterol, and HbA1c included effects large enough to be clinically important. "No statistically significant effect" is not "no effect" — the study could not distinguish a meaningful improvement from zero for these biomarkers.
    extra: |-
      About 12,000 people were surveyed and examined in the Portland-area in-person round, with only a fraction having elevated values at baseline. Both readings of the result are misuses: "Medicaid doesn't improve health" and "Medicaid was proven to improve these outcomes." The honest reading is that the study was informative about utilization, financial strain, depression, and diagnosis, and underpowered for cardiovascular biomarkers.

  - id: R006
    tags: [methods, did]
    front: |-
      What is the main threat to difference-in-differences estimates of ACA expansion effects?
    back: |-
      Expansion states are not randomly selected — they are richer, more urban, more Democratic, and had more generous pre-ACA Medicaid. If their outcome trends would have differed from non-expansion states anyway, the estimate is biased.
    extra: |-
      Standard defences: pre-trend tests, event-study plots, within-state comparisons of high- versus low-uninsurance areas, and triple-differences using an unaffected group (for example higher-income adults). A study without a visible event-study plot deserves scepticism.

  - id: R007
    tags: [methods, did]
    front: |-
      What is the staggered-adoption problem in two-way fixed effects, and why does it matter for Medicaid research?
    back: |-
      With treatments beginning at different times, standard TWFE estimates are weighted averages that can put <b>negative weights</b> on some comparisons — using already-treated units as controls for later adopters. With heterogeneous or dynamic effects the estimate can even carry the wrong sign.
    extra: |-
      Goodman-Bacon (2021) decomposed the problem; Callaway–Sant'Anna, Sun–Abraham, and de Chaisemartin–D'Haultfœuille supply robust estimators. Directly relevant here because states expanded in 2014, 2015, 2016, 2019, 2021, and 2023. Older papers using plain TWFE across staggered adopters deserve a second look.

  - id: R008
    priority: 1
    tags: [methods, mvpf]
    front: |-
      What is the Marginal Value of Public Funds (MVPF)?
    back: |-
      The ratio of beneficiaries' willingness to pay for a policy to its net cost to the government, where net cost accounts for fiscal externalities — later taxes paid, other benefits not claimed, other program spending avoided.
    extra: |-
      Hendren and Sprung-Keyser (2020, QJE) applied it to 133 policies and found that policies for <b>children</b> — including childhood Medicaid expansions — often have MVPF above 1 or effectively infinite, because the recipients later pay enough additional tax to repay the government's outlay. It is currently the standard common currency for comparing very different programs.

  - id: R009
    tags: [methods, outcomes]
    front: |-
      Why do self-reported and objectively measured health outcomes often diverge in insurance studies?
    back: |-
      Insurance increases diagnosis, so newly covered people learn they are sick — which can worsen self-reported health while improving actual care. Conversely self-reported health can improve through relief of financial anxiety without any physiological change.
    extra: |-
      Oregon showed both: large improvements in self-reported health and depression alongside increased detection of diabetes and no detectable movement in biomarkers. Any single-outcome summary of that study is misleading.

  - id: R010
    tags: [methods, mortality]
    front: |-
      Why is mortality both the best and the worst outcome for evaluating Medicaid?
    back: |-
      <b>Best</b>: unambiguous, objectively measured, and not subject to reporting bias. <b>Worst</b>: rare among non-elderly adults, so enormous samples are needed, and most of Medicaid's value (financial protection, pain, function, mental health) does not show up in it.
    extra: |-
      This is why the credible mortality studies use administrative data on millions of people (Miller-Johnson-Wherry, Goldin-Lurie-McCubbin) and why an underpowered survey finding no mortality effect tells you almost nothing.

  # --- The Oregon Health Insurance Experiment ------------------------------

  - id: R011
    priority: 1
    tags: [oregon, rct]
    front: |-
      What was the Oregon Health Insurance Experiment, and why is it unique?
    back: |-
      In 2008 Oregon had funding to add a limited number of adults to its Medicaid program (OHP Standard) and allocated the slots by <b>lottery</b> from a waiting list of about 90,000. This is the only randomized controlled trial of Medicaid coverage for adults.
    extra: |-
      About 30,000 were selected. Selection raised the probability of Medicaid coverage roughly 25 percentage points, giving a strong first stage. Researchers used administrative hospital, credit, and mortality data for everyone plus mail surveys, and in-person exams for the Portland-area subsample.

  - id: R012
    priority: 1
    tags: [oregon, rct, utilization]
    front: |-
      What did the Oregon experiment find in its first year (Finkelstein et al. 2012, QJE)?
    back: |-
      Medicaid increased utilization across the board — roughly 30 percent more hospital admissions, 35 percent more outpatient visits, 15 percent more prescriptions, and substantially more preventive screening — raising annual spending about 25 percent. It also improved self-reported physical and mental health and sharply reduced financial strain.
    extra: |-
      Finkelstein, Taubman, Wright, Bernstein, Gruber, Newhouse, Allen, Baicker, and the Oregon Health Study Group, <i>QJE</i> 127(3). The clean summary: coverage caused people to use more care, not less — no offsetting reduction from better primary care in year one.

  - id: R013
    priority: 1
    tags: [oregon, rct, health]
    front: |-
      What did the Oregon two-year results find (Baicker et al. 2013, NEJM)?
    back: |-
      - <b>No</b> statistically significant effect on blood pressure, cholesterol, or glycated hemoglobin
      - <b>Increased</b> diagnosis of diabetes and use of diabetes medication
      - <b>Reduced</b> the rate of depression by about 30 percent
      - <b>Virtually eliminated</b> catastrophic out-of-pocket medical spending
      - <b>Improved</b> self-reported health
    extra: |-
      <i>NEJM</i> 368:1713. The most contested result in the field. The biomarker nulls were imprecise (see R005), and few participants had poorly controlled values at baseline, so the sample had limited room to improve. The depression and financial protection results were large and precise, and are the findings that survive scrutiny best.

  - id: R014
    priority: 1
    tags: [oregon, rct, emergency]
    front: |-
      What did Taubman et al. (2014, Science) find about emergency department use?
    back: |-
      Medicaid <b>increased</b> ED use by about 40 percent — roughly 0.4 additional visits per person over about 18 months — including visits for conditions treatable in primary care, and the increase persisted over two years.
    extra: |-
      This contradicted the widespread expectation that coverage would divert people from the ED to primary care. Interpretation: coverage lowers the price of <i>all</i> care including ED care, and ED and outpatient care are complements rather than substitutes for this population. Later work (Finkelstein et al. 2016, NEJM) confirmed persistence.

  - id: R015
    tags: [oregon, rct, labor]
    front: |-
      What did the Oregon experiment find about employment and earnings?
    back: |-
      No statistically significant effect on employment or earnings, with confidence intervals tight enough to rule out large effects in either direction (Baicker, Finkelstein, Song, Taubman 2014, <i>AER Papers & Proceedings</i>).
    extra: |-
      The best available experimental evidence against a large labor-supply disincentive from Medicaid coverage. Caveat on external validity: these were people who had actively signed up for a waiting list, and OHP Standard covered a group already largely detached from steady employment.

  - id: R016
    priority: 1
    tags: [oregon, welfare]
    front: |-
      What did Finkelstein, Hendren, and Luttmer (2019, JPE) conclude about the value of Medicaid?
    back: |-
      Recipients' willingness to pay for Medicaid is only about <b>20-40 cents per dollar</b> of government cost. Much of the remaining value is a transfer to <b>external parties</b> — hospitals and others who would otherwise have absorbed the cost of uncompensated care.
    extra: |-
      "The Value of Medicaid: Interpreting Results from the Oregon Health Insurance Experiment," <i>JPE</i> 127(6). Two implications that pull in opposite directions: (1) Medicaid may be an inefficient way to transfer resources to recipients if they value it so little, and (2) evaluating Medicaid only by recipient outcomes badly understates its effects, since a large share of the benefit lands on providers and the implicitly insured. The low recipient valuation reflects the implicit insurance the uninsured already have through uncompensated care and bankruptcy.

  - id: R017
    tags: [oregon, limits]
    front: |-
      What are the limits on generalizing from the Oregon experiment?
    back: |-
      - One state, one pre-ACA program, one year of lottery draws
      - The population self-selected onto a waiting list — more motivated to obtain coverage than the average eligible person
      - OHP Standard was a limited benefit package
      - Two years is short for chronic disease outcomes
      - Statewide expansion would change provider supply and market conditions; a lottery of limited size does not
    extra: |-
      The last point is a general-equilibrium objection worth remembering: adding 10,000 people to a system does not test what happens when you add 10 million.

  # --- Coverage and mortality ---------------------------------------------

  - id: R018
    tags: [mortality, expansion]
    front: |-
      What did Sommers, Baicker, and Epstein (2012, NEJM) find?
    back: |-
      Using state Medicaid expansions in New York, Maine, and Arizona (2000-2005) with neighbouring states as controls, they found a <b>6.1 percent relative reduction in all-cause mortality</b> among adults aged 20-64 — roughly one death averted per 176 adults gaining coverage.
    extra: |-
      <i>NEJM</i> 367:1025. The most-cited pre-ACA mortality estimate. Caveats: results were driven substantially by New York; the design is DiD with a small number of treated states; and Kaestner and others argued the estimates were sensitive to control-group choice.

  - id: R019
    priority: 1
    tags: [mortality, expansion]
    front: |-
      What did Miller, Johnson, and Wherry (2021, QJE) find, and why is it the strongest expansion-mortality evidence?
    back: |-
      Linking large-scale survey data to Social Security death records, they found ACA Medicaid expansion reduced annual mortality among near-elderly low-income adults by about <b>0.13 percentage points</b> — roughly a 9 percent relative reduction, concentrated in health-care-amenable causes.
    extra: |-
      "Medicaid and Mortality: New Evidence from Linked Survey and Administrative Data," <i>QJE</i> 136(3). Strengths: individual-level administrative mortality (not aggregate rates), a sample large enough for precision, a population identifiable as low-income and likely eligible, and effects concentrated in causes treatable by medical care — which is what a causal story predicts and a confounding story does not.

  - id: R020
    tags: [mortality, rct]
    front: |-
      What did Goldin, Lurie, and McCubbin (2021, QJE) do, and why does it matter?
    back: |-
      A randomized experiment run through the IRS: letters were sent to millions of households that had paid the individual mandate penalty, encouraging enrollment. The letters raised coverage and <b>reduced two-year mortality</b> among middle-aged adults.
    extra: |-
      "Health Insurance and Mortality: Experimental Evidence from Taxpayer Outreach," <i>QJE</i> 136(1). It is one of very few <i>randomized</i> estimates of insurance's mortality effect, at a scale mortality actually requires. Note it concerns coverage generally (largely marketplace), not Medicaid specifically, and identifies the effect for people induced to enroll by a letter.

  - id: R021
    priority: 3
    tags: [mortality, children, history]
    front: |-
      What did Goodman-Bacon (2018, AER) find about Medicaid's original introduction?
    back: |-
      Using variation from the 1966-1970 rollout via state AFDC caseloads, he found Medicaid's introduction substantially reduced <b>nonwhite infant and child mortality</b> (on the order of 10-20 percent depending on age group and specification), with effects concentrated in causes treatable by medical care and essentially none for white children.
    extra: |-
      "Public Insurance and Mortality: Evidence from Medicaid's Implementation," <i>AER</i>. Strong design (large pre-existing variation in AFDC caseloads generating sharp differences in eligibility) and a clean falsification test — treatable causes move, non-treatable causes do not.

  - id: R022
    priority: 3
    tags: [mortality, children, history]
    front: |-
      What did Goodman-Bacon (2021, AER) find about the long-run effects of childhood Medicaid?
    back: |-
      Cohorts with more childhood Medicaid eligibility from the program's introduction had, as adults, lower disability rates and higher employment — with effects concentrated among nonwhite cohorts who gained the most eligibility.
    extra: |-
      "The Long-Run Effects of Childhood Insurance Coverage: Medicaid Implementation, Adult Health, and Labor Market Outcomes," <i>AER</i> 111(8). Together with his 2018 paper it establishes both the short-run mortality effect and the decades-later human capital effect from the same policy variation.

  # --- Children and long-run effects ---------------------------------------

  - id: R023
    priority: 1
    tags: [children, currie-gruber]
    front: |-
      What did Currie and Gruber (1996, JPE) find about Medicaid eligibility for pregnant women?
    back: |-
      The eligibility expansions of 1979-1992 — which roughly doubled eligibility among pregnant women — reduced infant mortality by about <b>8.5 percent</b>, and increased use of prenatal care.
    extra: |-
      "Saving Babies: The Efficacy and Cost of Recent Changes in the Medicaid Eligibility of Pregnant Women," <i>JPE</i> 104(6). Crucially, they found <b>targeted</b> expansions (to the poorest women) were far more cost-effective per life saved than <b>broad</b> expansions to higher incomes, because take-up and marginal health benefit both fell as eligibility widened. That targeting result is often forgotten by people who cite the headline.

  - id: R024
    tags: [children, currie-gruber]
    front: |-
      What did Currie and Gruber (1996, QJE) find about children's Medicaid eligibility?
    back: |-
      Expanding children's eligibility increased utilization of care and reduced child mortality by roughly <b>5 percent</b>, but take-up was low — a large share of newly eligible children never enrolled.
    extra: |-
      "Health Insurance Eligibility, Utilization of Medical Care, and Child Health," <i>QJE</i> 111(2). The low take-up finding is as important as the mortality finding: it means eligibility and coverage are very different treatments, and it launched a literature on enrollment barriers and outreach.

  - id: R025
    priority: 1
    tags: [children, long-run]
    front: |-
      What did Brown, Kowalski, and Lurie (2020, ReStud) find using tax data?
    back: |-
      Children with more Medicaid eligibility grew up to pay <b>more in cumulative federal income taxes</b>, collect less EITC, have higher college enrollment (women), and have lower mortality. The government recoups a substantial share of its original outlay through higher later tax receipts.
    extra: |-
      "Long-Term Impacts of Childhood Medicaid Expansions on Outcomes in Adulthood," <i>Review of Economic Studies</i> 87(2), using IRS administrative data on millions of children. This is the empirical backbone of the claim that childhood Medicaid has a very high — sometimes effectively infinite — MVPF.

  - id: R026
    priority: 3
    tags: [children, long-run, rd]
    front: |-
      What did Wherry and Meyer (2016, JHR) find, and what was the design?
    back: |-
      A regression discontinuity on <b>birthdate</b>: children born after September 30, 1983 gained Medicaid eligibility to 100 percent FPL under a 1990 expansion, while children born just before did not. Black teens in the eligible cohorts had significantly lower mortality; no effect was detected for white teens.
    extra: |-
      "Saving Teens: Using a Policy Discontinuity to Estimate the Effects of Medicaid Eligibility," <i>Journal of Human Resources</i> 51(3). The birthdate discontinuity is the cleanest natural experiment in the children's Medicaid literature and has been reused repeatedly.

  - id: R027
    priority: 3
    tags: [children, long-run]
    front: |-
      What did Wherry, Miller, Kaestner, and Meyer (2018) find about adult health care use?
    back: |-
      Using the same birthdate discontinuity, adults who had more childhood Medicaid eligibility had <b>fewer hospitalizations and emergency department visits</b> in adulthood, with the effect concentrated among Black adults and among conditions responsive to early treatment.
    extra: |-
      <i>Review of Economics and Statistics</i> 100(2). Along with Miller and Wherry's work on in utero exposure, this is the evidence that childhood coverage produces adult health capital, not just contemporaneous care.

  - id: R028
    priority: 3
    tags: [children, long-run]
    front: |-
      What did Miller and Wherry (2019, JHR) find about in utero Medicaid exposure?
    back: |-
      Adults whose mothers gained Medicaid eligibility during pregnancy had fewer chronic conditions and fewer hospitalizations decades later.
    extra: |-
      "The Long-Term Effects of Early Life Medicaid Coverage," <i>JHR</i> 54(3). Fits the fetal origins literature: the prenatal period is a high-leverage window, and Medicaid's pregnancy expansions are one of the largest policy experiments touching it.

  - id: R029
    priority: 3
    tags: [children, long-run, multigenerational]
    front: |-
      What did East, Miller, Page, and Wherry (2023, AER) find?
    back: |-
      In utero access to Medicaid improved the birth outcomes of the <b>next generation</b>: the children of women who themselves had prenatal Medicaid access had higher birth weight and lower rates of prematurity.
    extra: |-
      "Multigenerational Impacts of Childhood Access to the Safety Net: Early Life Exposure to Medicaid and the Next Generation's Health," <i>AER</i> 113(1). It implies conventional cost-benefit analyses truncated at one generation understate the return, and it is among the most striking results in the safety net literature.

  - id: R030
    priority: 3
    tags: [children, education]
    front: |-
      What did Cohodes, Grossman, Kleiner, and Lovenheim (2016, JHR) find?
    back: |-
      Greater childhood Medicaid eligibility reduced high school dropout and increased college attendance and four-year degree completion.
    extra: |-
      "The Effect of Child Health Insurance Access on Schooling: Evidence from Public Insurance Expansions," <i>JHR</i> 51(3). One channel in the broader finding that health insurance for children functions as human capital policy, alongside effects on test scores and school absence found elsewhere.

  # --- Financial effects ---------------------------------------------------

  - id: R031
    priority: 1
    tags: [financial, expansion]
    front: |-
      What did Hu, Kaestner, Mazumder, Miller, and Wong (2018, JPubE) find?
    back: |-
      Using consumer credit panel data, ACA Medicaid expansion reduced unpaid bills, debt sent to third-party collection (on the order of $1,000 per person gaining coverage), and improved credit scores; it also reduced payday borrowing and some measures of financial distress.
    extra: |-
      "The Effect of the Affordable Care Act Medicaid Expansions on Financial Wellbeing," <i>Journal of Public Economics</i> 163. Credit bureau data are the workhorse here: universal, administrative, high frequency, and unaffected by survey response bias.

  - id: R032
    priority: 3
    tags: [financial, expansion]
    front: |-
      What did Brevoort, Grodzicki, and Hackmann (2020, JHE) find about medical debt?
    back: |-
      Expansion sharply reduced medical debt in collections among newly eligible people — on the order of hundreds of dollars per person on average and much more per person gaining coverage — and improved subsequent access to credit.
    extra: |-
      "The Credit Consequences of Unpaid Medical Bills," <i>Journal of Health Economics</i> 72. Note the mechanism it exposes: uninsurance imposes costs beyond health care, through the credit market, on housing, employment, and borrowing.

  - id: R033
    priority: 3
    tags: [financial, uninsured]
    front: |-
      What did Dobkin, Finkelstein, Kluender, and Notowidigdo (2018, AER) establish?
    back: |-
      For non-elderly adults, a hospital admission causes large and persistent economic harm — increased unpaid bills and bankruptcy, and substantial declines in earnings and employment lasting years — with damage concentrated among the uninsured.
    extra: |-
      "The Economic Consequences of Hospital Admissions," <i>AER</i> 108(2). Important companion result: they also found "medical bankruptcy" claims in the literature had been substantially overstated by studies without a comparison group. Both findings come from the same careful design.

  - id: R034
    priority: 1
    tags: [financial, uncompensated-care]
    front: |-
      What did Garthwaite, Gross, and Notowidigdo (2018, QJE) find about hospitals?
    back: |-
      Hospitals act as insurers of last resort: a large share of the cost of the uninsured is absorbed as uncompensated care. Coverage expansions reduce uncompensated care substantially, and each dollar of new public insurance displaces roughly <b>20 cents</b> of uncompensated care.
    extra: |-
      "Hospitals as Insurers of Last Resort," <i>QJE</i>/<i>AEJ: Applied</i> line of work using the 2005 TennCare disenrollment and expansion variation. This quantifies the "implicit insurance" that explains why recipients' willingness to pay for Medicaid is well below its cost (see R016).

  - id: R035
    priority: 3
    tags: [financial, bankruptcy]
    front: |-
      What is Mahoney's (2015, AER) "bankruptcy as implicit health insurance" argument?
    back: |-
      Bankruptcy protection and the practical uncollectability of debt from low-asset households mean the uninsured already hold a form of implicit, incomplete insurance. This lowers their willingness to pay for formal coverage and blunts the individual mandate's effect.
    extra: |-
      <i>AER</i> 105(2). Combined with the uncompensated care result, it explains a puzzle: why very poor people sometimes decline free or nearly free coverage. They have less to protect than the actuarial value of the policy suggests.

  # --- Labor supply --------------------------------------------------------

  - id: R036
    tags: [labor]
    front: |-
      What did Garthwaite, Gross, and Notowidigdo (2014, QJE) find using the TennCare disenrollment?
    back: |-
      Tennessee's 2005 disenrollment of roughly 170,000 adults from TennCare caused a <b>large increase in employment</b> among those affected, as people sought jobs with employer-sponsored coverage — evidence of "employment lock" running in reverse.
    extra: |-
      "Public Health Insurance, Labor Supply, and Employment Lock," <i>QJE</i> 129(2). It is the strongest evidence that public coverage reduces labor supply at some margin. Note the population and margin: childless adults losing coverage abruptly, responding by seeking <i>insured</i> employment specifically.

  - id: R037
    tags: [labor]
    front: |-
      What does the ACA expansion literature find about labor supply?
    back: |-
      Broadly no significant reduction in employment or hours from expansion, across multiple designs — Kaestner et al. (2017, JPAM), Gooptu et al. (2016, Health Affairs), Leung and Mas (2018), and the Oregon experiment. Some studies find small increases in employment among low-income childless adults.
    extra: |-
      Reconciling this with Garthwaite et al.: losing coverage abruptly is not the mirror image of gaining it. The Tennessee result operates through employer-sponsored insurance as the only alternative; ACA expansion arrived alongside marketplace subsidies, so the coverage-employment link was weaker.

  - id: R038
    priority: 3
    tags: [labor]
    front: |-
      What did Dague, DeLeire, and Leininger (2017, AEJ: Economic Policy) find?
    back: |-
      Using enrollment caps and waiting lists in Wisconsin's BadgerCare, they found public health insurance enrollment reduced employment measurably — larger effects than most ACA expansion studies report.
    extra: |-
      "The Effect of Public Insurance Coverage for Childless Adults on Labour Supply," <i>AEJ: EP</i> 9(2). The design identifies the effect for people at an enrollment margin created by a cap, which may be a more employment-attached group. Cite it as the strongest counterweight to the "no labor supply effect" consensus rather than pretending the consensus is unanimous.

  - id: R039
    priority: 1
    tags: [labor, work-requirements]
    front: |-
      What did Sommers et al. (2019, NEJM) find about Arkansas's work requirement?
    back: |-
      In its first year (2018) roughly <b>18,000 people lost coverage</b>, uninsurance rose, and there was <b>no significant change in employment</b>. Most targeted enrollees were already working or should have qualified for an exemption; a large share were unaware the requirement applied to them.
    extra: |-
      "Medicaid Work Requirements — Results from the First Year in Arkansas," <i>NEJM</i> 381:1073. The single most policy-relevant study in this deck, and the reason "reporting burden, not work behavior, is the binding constraint" is the mainstream reading. Arkansas required monthly online reporting in a state with limited broadband.

  - id: R040
    tags: [labor, work-requirements]
    front: |-
      What is the broader evidence on work requirements in safety net programs?
    back: |-
      Across TANF, SNAP, and housing programs, work requirements reliably reduce <b>enrollment</b>, produce small and usually temporary employment gains concentrated among those closest to the labor market, and increase deep poverty among those who lose benefits without gaining work.
    extra: |-
      TANF is the fullest case: caseloads fell dramatically after 1996, employment rose during a strong economy and then largely converged, and deep child poverty rose. Medicaid differs in an important way — the benefit is in-kind and lumpy, so losing it does not smoothly reduce consumption but exposes people to catastrophic risk.

  # --- Crowd-out -----------------------------------------------------------

  - id: R041
    tags: [crowd-out]
    front: |-
      What is "crowd-out," and what did Cutler and Gruber (1996) find?
    back: |-
      Crowd-out is the substitution of public coverage for private coverage people would otherwise have held. Cutler and Gruber estimated that roughly <b>half</b> of the increase in Medicaid coverage from the late-1980s expansions was offset by reductions in private coverage.
    extra: |-
      "Does Public Insurance Crowd Out Private Insurance?" <i>QJE</i> 111(2). The estimate was politically explosive and shaped CHIP's design (waiting periods, premium requirements). Later work using different designs — Card and Shore-Sheppard, Ham and Shore-Sheppard — found much smaller crowd-out for the tightly targeted expansions, and the range across the literature is wide.

  - id: R042
    tags: [crowd-out]
    front: |-
      Why is crowd-out contested, and how should you interpret an estimate?
    back: |-
      Estimates range from near zero to over half depending on the population, the design, and whether the counterfactual accounts for secular decline in employer coverage. Crowd-out is also not automatically a welfare loss — moving a low-income family from an expensive, thin employer plan to Medicaid can raise their welfare while raising public cost.
    extra: |-
      Two questions to ask of any crowd-out number: what is the comparison group (crowd-out is mechanically larger where private coverage was common), and is the private coverage being displaced actually good coverage? For the ACA expansion population, private coverage rates were low, so crowd-out is a smaller concern than in the 1990s child expansions.

  # --- Managed care --------------------------------------------------------

  - id: R043
    tags: [managed-care, research]
    front: |-
      What did Duggan (2004, JPubE) find about Medicaid managed care in California?
    back: |-
      Using county-level variation in mandatory HMO enrollment, he found the shift to managed care <b>increased</b> Medicaid spending — by roughly 17 percent — with no detectable improvement in health outcomes.
    extra: |-
      "Does Contracting Out Increase the Efficiency of Government Programs? Evidence from Medicaid HMOs," <i>JPubE</i> 88. The mechanism: California's fee-for-service rates were already very low, so capitation rates set relative to prevailing costs did not save money — the state was already paying near the floor.

  - id: R044
    tags: [managed-care, research]
    front: |-
      What did Duggan and Hayford (2013, JPAM) find across states?
    back: |-
      Mandatory managed care did <b>not</b> reduce Medicaid spending on average. The effect depended on the state's prior fee-for-service rates: where FFS rates had been high, managed care produced savings; where they were already low, it increased spending.
    extra: |-
      "Has Contracting Out Improved the Efficiency of U.S. Medicaid?" <i>JPAM</i> 32(3). This is the key conditional result. It explains why national debates about whether "managed care saves money" are unresolvable in the abstract — the answer is a function of the counterfactual price level.

  - id: R045
    priority: 3
    tags: [managed-care, research, disparities]
    front: |-
      What did Kuziemko, Meckel, and Rossin-Slater (2018) find about managed care and infant health?
    back: |-
      Under Texas's mandatory Medicaid managed care, incomplete risk adjustment gave plans incentives to avoid high-risk pregnancies. Health disparities for Black infants worsened relative to white infants after the transition.
    extra: |-
      "Does Managed Care Widen Infant Health Disparities? Evidence from Texas Medicaid," <i>AEJ: Economic Policy</i> 10(3). A concrete demonstration that risk adjustment is not a technical detail: when payment does not track expected cost, selection incentives fall hardest on the highest-risk groups.

  - id: R046
    priority: 3
    tags: [managed-care, research]
    front: |-
      What does the random plan assignment literature show about Medicaid MCOs?
    back: |-
      Exploiting quasi-random auto-assignment, plans have substantial causal effects on spending and utilization for otherwise identical enrollees — differences driven mainly by utilization management and network composition rather than by prices.
    extra: |-
      Geruso, Layton, and Wallace, "What Difference Does a Health Plan Make? Evidence from Random Plan Assignment in Medicaid," and related work by Layton, Maestas, Prinz, and Vabson on rationing in public insurance. The policy implication is direct: which plan a person is assigned to matters, so auto-assignment algorithms and plan quality measurement have real stakes.

  - id: R047
    tags: [managed-care, evidence-gap]
    front: |-
      What is the overall state of evidence on Medicaid managed care?
    back: |-
      Much weaker than its market share warrants. Reliable evidence on comprehensive MCO effects on <i>health</i> outcomes is thin, evidence on MLTSS is thinner, and most state-level evaluations lack credible comparison groups. The best-identified findings concern spending, utilization, selection, and plan-level variation.
    extra: |-
      The reason is structural: states adopt managed care statewide and at once, leaving no comparison group. The counties-and-phases designs that produced the good studies (California, Texas, New York) exist because those states rolled out geographically. It is a strong argument for phased implementation as a research policy.

  # --- Access, providers, payment ------------------------------------------

  - id: R048
    tags: [access, payment]
    front: |-
      What did Polsky et al. (2015, NEJM) find about the primary care fee bump?
    back: |-
      In an audit ("secret shopper") study, appointment availability for new Medicaid patients rose by about <b>7.7 percentage points</b> — from roughly 59 to 66 percent — during the 2013-2014 period when Medicaid paid Medicare rates for primary care, with larger gains where the rate increase was larger.
    extra: |-
      "Appointment Availability after Increases in Medicaid Payments for Primary Care," <i>NEJM</i> 372:537. Audit designs are strong here because they measure actual access rather than physician self-report, and they eliminate patient-side confounding. Follow-up work found availability declined after the bump expired.

  - id: R049
    tags: [access, payment]
    front: |-
      What is the general finding on Medicaid payment rates and access?
    back: |-
      Higher Medicaid fees increase provider participation and appointment availability, with elasticities large enough to matter but far from sufficient to close the gap with private insurance. Effects are larger for primary care and for specialties with excess capacity.
    extra: |-
      Supporting work includes Decker's studies of physician acceptance, Alexander and Schnell on payments and health outcomes, and Buchmueller and colleagues on dental fees and children's dental care. The dental literature is unusually clean because dental fees vary sharply across states.

  - id: R050
    tags: [access, hospitals]
    front: |-
      What did the research find about expansion's effects on hospital finances?
    back: |-
      Expansion sharply reduced uncompensated care and improved hospital operating margins, with the largest effects for hospitals serving the most uninsured patients. Expansion was also associated with a reduced probability of <b>rural hospital closure</b>.
    extra: |-
      Dranove, Garthwaite, and Ody (2016) on uncompensated care; Blavin (2016, JAMA) on margins; Lindrooth et al. (2018, Health Affairs) on closures. This is why hospital associations are consistently among the strongest advocates of expansion and among the loudest opponents of provider tax and directed payment restrictions.

  - id: R051
    priority: 3
    tags: [drugs, research]
    front: |-
      What did Duggan and Scott Morton (2006, QJE) find about Medicaid drug purchasing?
    back: |-
      The Medicaid best price rule raised prices in the <b>private</b> market: for drugs with a high Medicaid share of sales, manufacturers had a strong incentive not to discount to private purchasers, since any private discount would trigger larger Medicaid rebates.
    extra: |-
      "The Distortionary Effects of Government Procurement: Evidence from Medicaid Prescription Drug Purchasing," <i>QJE</i> 121(1). The canonical demonstration that a government purchasing rule can have large effects on prices paid by everyone else — an argument that recurs in every debate over most-favored-nation drug pricing.

  # --- ACA expansion effects, broadly --------------------------------------

  - id: R052
    tags: [expansion, access]
    front: |-
      What did Sommers, Gunja, Finegold, and Musco (2015, JAMA) find?
    back: |-
      Comparing Kentucky (Medicaid expansion) and Arkansas (private option) to Texas (no expansion), the expansion states saw large coverage gains, increased access to a usual source of care and medications, fewer skipped medications from cost, and improved self-reported health.
    extra: |-
      <i>JAMA</i> 314(4). The Kentucky/Arkansas contrast also allowed a comparison of Medicaid versus premium assistance: broadly similar access outcomes through both routes, an important null for the "private coverage works better" claim.

  - id: R053
    priority: 3
    tags: [expansion, prevention]
    front: |-
      What is the evidence on expansion and preventive care and cancer?
    back: |-
      Expansion increased use of preventive services and cancer screening, and increased the share of cancers diagnosed at an <b>early stage</b> — a plausible mechanism for later mortality effects.
    extra: |-
      Simon, Soni, and Cawley (2017, JPAM) on preventive care; Soni and colleagues on stage at diagnosis. Stage shift is a valuable intermediate outcome because mortality effects from cancer screening take years to appear and are hard to detect directly.

  - id: R054
    priority: 3
    tags: [expansion, behavioral-health]
    front: |-
      What is the evidence on expansion and substance use disorder treatment?
    back: |-
      Expansion substantially increased Medicaid-covered substance use treatment and, in particular, prescriptions for medications for opioid use disorder such as buprenorphine and naltrexone.
    extra: |-
      Maclean and Saloner (2019, JPAM); Wen, Druss, and Cummings (2015, HSR) and related work. Medicaid is the largest payer for SUD treatment, so expansion effects here operate on a large base. This literature is central to arguments connecting Medicaid policy to overdose mortality.

  - id: R055
    priority: 3
    tags: [expansion, other-outcomes]
    front: |-
      What non-health effects of Medicaid expansion have been documented?
    back: |-
      Reduced crime and recidivism (Vogler, 2020), reduced evictions and improved housing stability, reduced payday lending, improved food security, and reductions in some measures of family financial distress.
    extra: |-
      These matter for cost-benefit accounting: a program evaluated only on health outcomes will understate its return if it also reduces incarceration and homelessness costs. They also raise the standard caution — many of these outcomes are studied with fewer designs and smaller samples than coverage and mortality.

  - id: R056
    priority: 3
    tags: [expansion, maternal]
    front: |-
      What is the evidence on Medicaid expansion and maternal and infant outcomes?
    back: |-
      Expansion is associated with reductions in infant mortality (concentrated among Black infants), improvements in preconception health and coverage continuity, and reductions in maternal mortality in several studies — though maternal mortality is rare enough that estimates are imprecise.
    extra: |-
      This literature underpins the 12-month postpartum extension, which became the most widely adopted state Medicaid option of the past decade. Note the recurring pattern in Medicaid research: effects concentrate among Black recipients, because baseline access gaps were largest there.

  # --- Unwinding and administrative burden ---------------------------------

  - id: R057
    tags: [unwinding, research]
    front: |-
      What does research on the 2023-24 unwinding show?
    back: |-
      Roughly 25 million people were disenrolled, with the large majority terminated for <b>procedural</b> reasons rather than a determination of ineligibility. Survey work found about one in eight Medicaid enrollees had exited within six months of the start, and roughly half of those losing Medicaid became uninsured at least temporarily.
    extra: |-
      The four-state survey work (Arkansas, Kentucky, Louisiana, Texas) published in <i>JAMA Health Forum</i> is the standard citation. A partly offsetting finding: Health Affairs work on prescription volume found much of the decline in Medicaid-paid prescriptions was offset by commercial-paid prescriptions, implying a substantial share transitioned to other coverage.

  - id: R058
    tags: [unwinding, lessons]
    front: |-
      What is the policy lesson from the unwinding for the 2027 work requirement?
    back: |-
      It is the closest available natural experiment in mass redetermination. States that automated renewals through data matching lost far fewer eligible people than states relying on returned paperwork, and coverage loss tracked administrative capacity more than it tracked eligibility.
    extra: |-
      Applied to work requirements: whether the state verifies compliance from payroll and other data or requires enrollee reporting is likely to matter more for coverage outcomes than the hours threshold or the exemption list. This is the main forward-looking inference the evidence supports.

  - id: R059
    tags: [take-up, administrative-burden]
    front: |-
      What does the literature say about Medicaid take-up and enrollment barriers?
    back: |-
      A substantial share of eligible people are not enrolled. Take-up responds strongly to administrative design — application assistance, outreach, simplified forms, presumptive eligibility, and default or automatic enrollment all raise it, often more than changes in the benefit's value would.
    extra: |-
      Aizer (2007, ReStat) showed outreach and application assistance increased enrollment and reduced avoidable hospitalizations among children. Currie's work on take-up of social benefits is the general framework. The theme: for this population, friction is a more powerful lever than price.

  - id: R060
    tags: [administrative-burden, theory]
    front: |-
      What is the Herd and Moynihan framework for administrative burden?
    back: |-
      Burden has three components: <b>learning costs</b> (finding out a program exists and whether you qualify), <b>compliance costs</b> (paperwork, documentation, appointments, time), and <b>psychological costs</b> (stigma, stress, loss of autonomy).
    extra: |-
      Useful because it makes burden a policy variable rather than an inevitability, and because it explains the Arkansas result cleanly: learning costs dominated (most affected people did not know the requirement applied to them) even before compliance costs bit.

  # --- Long-term care ------------------------------------------------------

  - id: R061
    priority: 3
    tags: [ltss, research]
    front: |-
      What did Brown and Finkelstein (2008, AER) find about Medicaid and private long-term care insurance?
    back: |-
      Medicaid imposes a large <b>implicit tax</b> on private LTC insurance: because Medicaid pays once assets are spent down, private coverage mostly duplicates benefits the person would receive anyway. For a large share of the wealth distribution this alone can explain not buying it.
    extra: |-
      "The Interaction of Public and Private Insurance: Medicaid and the Long-Term Care Insurance Market," <i>AER</i> 98(3). This is the fundamental obstacle to private-market solutions for LTSS, and it is why Partnership programs (which shield assets equal to benefits paid) address only a small part of the problem.

  - id: R062
    priority: 3
    tags: [ltss, research]
    front: |-
      What does research show about HCBS versus institutional care costs?
    back: |-
      Per-person HCBS costs are substantially lower than nursing facility costs, but expanding HCBS increases the number of people served, so short-run total spending often rises. Studies with longer horizons generally find institutional use and total LTSS growth moderate as HCBS capacity matures.
    extra: |-
      This is the empirical content of the "woodwork effect" debate (D040). The methodological difficulty is that HCBS expansion is not random — states expand where demand and political support exist — so cross-state comparisons are weakly identified.

  - id: R063
    priority: 3
    tags: [ltss, research]
    front: |-
      What is the evidence on nursing home quality and Medicaid payment?
    back: |-
      Facilities with higher Medicaid census have lower staffing and worse measured quality, and higher Medicaid payment rates are associated with modest improvements in staffing. Ownership matters as well — private equity acquisition has been linked to reduced staffing and worse outcomes in several studies.
    extra: |-
      Because Medicaid pays for most nursing home days, Medicaid rates effectively set the industry's cost structure. Note the persistent confounding: high-Medicaid facilities differ systematically in location and case mix, so cross-sectional quality comparisons overstate the payment effect.

  # --- Synthesis and contested questions -----------------------------------

  - id: R064
    priority: 1
    tags: [synthesis]
    front: |-
      What is the fair summary of what Medicaid does, based on the literature?
    back: |-
      - <b>Strong evidence</b>: increases utilization; provides large financial protection; reduces depression; improves access and self-reported health; improves outcomes for children with large long-run returns
      - <b>Good evidence</b>: reduces mortality for adults, with the best estimates around a 9 percent relative reduction among affected low-income populations
      - <b>Weak or mixed evidence</b>: short-run effects on chronic disease biomarkers; managed care effects on health; effects on labor supply
    extra: |-
      Note the shape: the effects easiest to detect are the ones insurance is most directly designed to produce (use of care and protection from cost). Effects on physiology run through a longer causal chain with more places to fail.

  - id: R065
    priority: 1
    tags: [synthesis, debate]
    front: |-
      How do critics and defenders each mishandle the Oregon results?
    back: |-
      <b>Critics</b> read the biomarker nulls as proof Medicaid does not improve health, ignoring the confidence intervals, the two-year horizon, and the large significant effects on depression, financial strain, and diagnosis.
      <b>Defenders</b> sometimes minimize a genuine and important null and downplay the 40 percent increase in ED use, which contradicted a specific policy prediction.
    extra: |-
      The disciplined statement: Oregon showed Medicaid does what insurance does — pays for care and removes financial risk — and did not demonstrate short-run improvement in cardiovascular and metabolic control, at a sample size that could not have detected modest improvement anyway.

  - id: R066
    priority: 1
    tags: [synthesis, debate]
    front: |-
      What is the strongest evidence-based case <i>against</i> expanding Medicaid?
    back: |-
      - Recipients' own willingness to pay is well below government cost (Finkelstein-Hendren-Luttmer), so cash or other transfers might do more per dollar
      - Short-run physical health effects for adults are hard to detect
      - Crowd-out means some spending buys no new coverage
      - Low payment rates mean coverage does not reliably convert into access
      - Some evidence of labor supply reduction at particular margins
    extra: |-
      Learn to state this well. Each point has a rebuttal — the low WTP partly reflects existing implicit insurance rather than low value; mortality effects <i>are</i> detected in large administrative samples; crowd-out is small for the expansion population; the access problem argues for higher rates rather than less coverage — but the argument is a serious one and dismissing it is a mistake.

  - id: R067
    priority: 1
    tags: [synthesis, debate]
    front: |-
      Why is "does Medicaid improve health?" the wrong question?
    back: |-
      Because it collapses distinct questions with different answers: for whom (children versus adults versus people needing LTSS), over what horizon (two years versus thirty), on what outcome (mortality, biomarkers, mental health, financial security), and compared to what (uninsurance, or private coverage).
    extra: |-
      The literature answers the disaggregated questions reasonably well. Almost every unproductive public argument about Medicaid comes from two people answering different disaggregated questions while believing they disagree about one.

  - id: R068
    priority: 1
    tags: [synthesis, cost-effectiveness]
    front: |-
      How does Medicaid look in cost-effectiveness or MVPF terms?
    back: |-
      <b>Children's Medicaid</b> ranks among the highest-return government policies studied — the later tax revenue from improved adult outcomes offsets a large share, sometimes all, of the original cost. <b>Adult expansions</b> look more ordinary: valuable, but not self-financing.
    extra: |-
      Hendren and Sprung-Keyser (2020, QJE), drawing on Brown-Kowalski-Lurie and the childhood Medicaid literature. It is the clearest example of the general MVPF result that policies for children outperform policies for adults, and it argues for protecting children's coverage first in any budget contraction.

  - id: R069
    tags: [synthesis, evidence-gaps]
    front: |-
      What are the largest evidence gaps in Medicaid research?
    back: |-
      - Managed care effects on health outcomes, and MLTSS effects generally
      - What actually works in HCBS, and how to measure quality in it
      - Provider payment design beyond simple fee levels
      - The dual eligible population, despite its cost share
      - Long-run effects of the 2025 law's provisions, which will not be knowable for years
      - Interaction effects: what happens when eligibility friction, financing limits, and cost sharing all change at once
    extra: |-
      A common thread: the gaps cluster where states implement statewide and simultaneously, leaving no comparison group. That is a design choice, not a fact of nature — phased rollout would convert many of these into answerable questions.

  - id: R070
    tags: [reform, cbo]
    front: |-
      What did CBO estimate for the major recent Medicaid reform proposals?
    back: |-
      - <b>AHCA / BCRA (2017)</b>: roughly $800 billion in federal Medicaid reductions over ten years, and 14-15 million fewer Medicaid enrollees, from per capita caps plus expansion rollback
      - <b>2025 reconciliation law</b>: roughly $900 billion-$1 trillion in federal Medicaid reductions, with about 7.5 million more uninsured from the Medicaid provisions by 2034
    extra: |-
      The through-line worth remembering: in every major capped-financing or eligibility-restriction proposal, CBO's savings arise substantially from fewer people covered. That is the mechanism, not a side effect. Verify current numbers before citing.

  - id: R071
    tags: [reform, evidence]
    front: |-
      What does the evidence predict about the 2027 federal work requirement?
    back: |-
      Based on Arkansas, Georgia, and the unwinding: substantial coverage loss concentrated among people who are already working or exempt but fail to document it; little or no employment effect; and administrative costs that consume a large share of any savings.
    extra: |-
      Two reasons to hold the prediction loosely. The federal design differs from Arkansas's — six-month rather than monthly reporting, a required ex parte verification framework, and a much longer implementation runway. And the scale is national, so labor market general equilibrium effects that were undetectable in one state could differ. Watch the implementing rule's verification provisions closely.

  - id: R072
    tags: [reform, evidence]
    front: |-
      What does research say about the coverage effects of cost sharing and premiums in Medicaid?
    back: |-
      Even small premiums produce meaningful disenrollment and non-enrollment, with the largest effects at the lowest incomes. Copays reduce use of high-value services along with low-value ones and are frequently uncollectable in practice.
    extra: |-
      The RAND Health Insurance Experiment is the foundational evidence on the utilization side (cost sharing reduced appropriate and inappropriate care alike, with adverse health effects for the poorest and sickest participants). Oregon's and Indiana's experience supply the Medicaid-specific enrollment evidence.

  - id: R073
    priority: 3
    tags: [reform, safety-net]
    front: |-
      What happens to health care use and cost when Medicaid coverage is withdrawn?
    back: |-
      The TennCare disenrollment is the best evidence: uninsurance rose sharply, hospital uncompensated care rose, employment rose among those seeking employer coverage, and mortality effects have been found in some analyses of the same episode.
    extra: |-
      Withdrawal episodes are analytically valuable because they identify the effect of coverage <i>loss</i>, which need not be the mirror image of coverage gain — established treatment relationships break, and people lose care they had come to rely on. Expect the 2025 law to generate the next generation of such studies.

  - id: R074
    tags: [reading, sources]
    front: |-
      Which authors should you follow to keep current on Medicaid research?
    back: |-
      Katherine Baicker, Amy Finkelstein, Benjamin Sommers, Sarah Miller, Laura Wherry, Andrew Goodman-Bacon, Craig Garthwaite, Mark Duggan, Timothy Layton, Thomas Buchmueller, Janet Currie, Jonathan Gruber, Sayeh Nikpay, Johanna Maclean.
    extra: |-
      Venues: <i>Journal of Health Economics</i>, <i>AEJ: Economic Policy</i>, <i>JPubE</i>, <i>Health Affairs</i>, <i>JAMA Health Forum</i>, <i>NEJM</i> perspectives, and NBER working papers (health care and public economics programs). For policy analysis rather than research: MACPAC, KFF, CBPP, the Urban Institute, and Paragon Health Institute (for the market-oriented critique).

  - id: R075
    priority: 1
    tags: [reading, critical]
    front: |-
      What questions should you ask when reading any Medicaid study?
    back: |-
      - What generated the variation in coverage, and is it plausibly independent of health?
      - Who is the population, and what is the counterfactual coverage state?
      - Is the outcome measured administratively or self-reported?
      - Is a null result precise enough to be informative?
      - Over what horizon, and is that long enough for the mechanism claimed?
      - Does the result survive robust staggered-adoption estimators, if it uses DiD?
    extra: |-
      Question four is the one most often skipped. A confidence interval that spans "no effect" and "large effect" is not evidence of no effect, and a great deal of published Medicaid commentary treats it as though it were.

  - id: R076
    priority: 1
    tags: [synthesis, framing]
    front: |-
      What is the single most important conceptual point connecting Medicaid research to Medicaid policy?
    back: |-
      Medicaid's measured effects depend on what it is compared to. Against genuine uninsurance it delivers large gains in access, financial protection, and (for children and over long horizons) health. Against a counterfactual of uncompensated care and charity care, the incremental gain to the recipient is smaller — because the uninsured already hold implicit, incomplete insurance that someone else finances.
    extra: |-
      This resolves the apparent tension between Finkelstein-Hendren-Luttmer's low recipient valuation and the large mortality and financial effects found elsewhere. Both are true: Medicaid's benefits are real and substantial, and a meaningful share of them accrue to parties other than the enrollee.
