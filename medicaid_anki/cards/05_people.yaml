deck: "Medicaid::5. People & Institutions"
deck_id: 2059400115
default_priority: 2
tags: [medicaid, people]

# ---------------------------------------------------------------------------
# The point of this deck is recognition: seeing a name on a paper, a panel, or
# a citation and knowing immediately what body of work it belongs to and how
# much weight to give it.
#
# Affiliations move — people change institutions and rotate through government.
# Each card gives the affiliation someone is most associated with, but the
# durable fact is the body of work, not the letterhead. Don't drill titles.
# ---------------------------------------------------------------------------

cards:

  # --- The Oregon / health insurance economics core ------------------------

  - id: P001
    priority: 1
    tags: [economists]
    front: |-
      <b>Amy Finkelstein</b> — what is she known for?
    back: |-
      MIT economist; co-principal investigator of the <b>Oregon Health Insurance Experiment</b>. Also: the welfare value of Medicaid (with Hendren and Luttmer), the economic consequences of hospital admissions, and foundational work on selection in insurance markets.
    extra: |-
      Clark Medal and MacArthur Fellowship. Co-author of <i>We've Got You Covered</i> (with Liran Einav), which argues for universal basic coverage on the grounds that the U.S. already provides ad hoc coverage badly. If you read one author to understand how economists think about health insurance, this is the one.

  - id: P002
    priority: 1
    tags: [economists]
    front: |-
      <b>Katherine Baicker</b> — what is she known for?
    back: |-
      Health economist (University of Chicago, where she became Provost); co-principal investigator of the <b>Oregon Health Insurance Experiment</b> and lead author of the two-year NEJM results.
    extra: |-
      Also known for work on the value of health insurance, employer wellness programs, and cost-effectiveness in coverage design. She has been notably careful in public about what Oregon does and does not show — a good model for how to talk about a contested null.

  - id: P003
    priority: 1
    tags: [economists, physicians]
    front: |-
      <b>Benjamin Sommers</b> — what is he known for?
    back: |-
      Physician-economist at Harvard's Chan School; the most prolific author on <b>coverage expansion effects</b>. Key work: state expansions and mortality (2012 NEJM), the Kentucky/Arkansas/Texas comparison, and the evaluation of <b>Arkansas's work requirement</b> (2019 NEJM).
    extra: |-
      Has served in government at HHS/ASPE, so his work sits close to policy. If a coverage-expansion question has been studied at all, he has probably written on it — a good first search.

  - id: P004
    priority: 1
    tags: [economists]
    front: |-
      <b>Sarah Miller</b> — what is she known for?
    back: |-
      Economist at Michigan Ross; lead author of <b>"Medicaid and Mortality: New Evidence from Linked Survey and Administrative Data"</b> (2021, QJE) — the strongest evidence that ACA expansion reduced adult mortality.
    extra: |-
      Also works on the long-run effects of early-life Medicaid and on medical debt and financial outcomes. Frequently co-authors with Laura Wherry.

  - id: P005
    priority: 1
    tags: [economists]
    front: |-
      <b>Laura Wherry</b> — what is she known for?
    back: |-
      Economist at NYU Wagner; the <b>long-run effects of childhood Medicaid</b>, using the September 30, 1983 birthdate discontinuity — effects on teen mortality, adult hospitalization, and (with East, Miller, and Page) the next generation's birth outcomes.
    extra: |-
      Miller and Wherry are the pairing to know for anything about early-life Medicaid exposure and adult outcomes. Their work is the empirical basis for treating children's Medicaid as human capital policy.

  - id: P006
    priority: 1
    tags: [economists]
    front: |-
      <b>Andrew Goodman-Bacon</b> — what is he known for, in two separate literatures?
    back: |-
      - <b>Medicaid</b>: the effects of the program's original 1966-70 introduction on child mortality, and its long-run effects on adult health and labor market outcomes
      - <b>Econometrics</b>: the <b>Goodman-Bacon decomposition</b>, showing how two-way fixed effects DiD breaks down under staggered treatment timing
    extra: |-
      Now at the Federal Reserve Bank of Minneapolis. An unusual case of one person being canonical both for a substantive Medicaid finding and for the method everyone now has to use to check their own DiD estimates.

  - id: P007
    tags: [economists]
    front: |-
      <b>Craig Garthwaite</b> — what is he known for?
    back: |-
      Northwestern Kellogg economist; <b>"Public Health Insurance, Labor Supply, and Employment Lock"</b> (the TennCare disenrollment) and <b>"Hospitals as Insurers of Last Resort"</b> (uncompensated care).
    extra: |-
      Works at the intersection of health policy and industrial organization — hospital and pharmaceutical market behavior as well as coverage. Often a useful counterweight: rigorous but not reflexively pro-expansion.

  - id: P008
    tags: [economists]
    front: |-
      <b>Mark Duggan</b> — what is he known for?
    back: |-
      Stanford economist; the foundational work on <b>Medicaid managed care</b> (the California county study, and with Hayford the multi-state result that savings depend on prior FFS rates) and on <b>drug purchasing distortions</b> (with Scott Morton, on the best price rule).
    extra: |-
      Also major work on Medicare Advantage, Part D, and disability insurance. The theme across all of it is how government purchasing rules generate unintended market responses.

  - id: P009
    tags: [economists]
    front: |-
      <b>Jonathan Gruber</b> — what is he known for in the Medicaid literature specifically?
    back: |-
      MIT economist; with Janet Currie, the canonical <b>eligibility expansion</b> papers on pregnant women and children, including the simulated eligibility instrument; and with David Cutler, the canonical <b>crowd-out</b> estimate.
    extra: |-
      Also central to the design of Massachusetts's 2006 reform and the ACA. His Medicaid work from the 1990s still defines the methods used in the eligibility literature.

  - id: P010
    tags: [economists]
    front: |-
      <b>Janet Currie</b> — what is she known for?
    back: |-
      Princeton economist; the economics of <b>child health and early-life investment</b>, including the Currie-Gruber Medicaid eligibility papers and a body of work on <b>take-up</b> of social programs.
    extra: |-
      Her survey work on why eligible people do not enroll is the intellectual ancestor of the current administrative burden literature. For anything about children and the safety net, she is the starting point.

  - id: P011
    tags: [economists, welfare]
    front: |-
      <b>Nathaniel Hendren</b> — what is he known for?
    back: |-
      Economist (MIT, previously Harvard); the <b>Marginal Value of Public Funds</b> framework and, with Ben Sprung-Keyser, "A Unified Welfare Analysis of Government Policies" — the finding that policies for children have the highest returns.
    extra: |-
      Also a co-author on the value of Medicaid paper with Finkelstein and Luttmer. If you need a single common metric to compare Medicaid against unrelated programs, MVPF is currently it, and this is its source.

  - id: P012
    tags: [economists]
    front: |-
      <b>Neale Mahoney</b> and <b>Matthew Notowidigdo</b> — what are they known for?
    back: |-
      The economics of <b>medical debt and financial distress</b>. Mahoney: "Bankruptcy as Implicit Health Insurance." Notowidigdo: the economic consequences of hospital admissions, employment lock, and hospitals as insurers of last resort — usually with Dobkin, Finkelstein, Kluender, Gross, or Garthwaite.
    extra: |-
      Between them they define the modern literature on what uninsurance actually costs people financially — and on why "medical bankruptcy" statistics from earlier work were overstated.

  - id: P013
    tags: [economists, managed-care]
    front: |-
      <b>Timothy Layton</b>, <b>Michael Geruso</b>, and <b>Jacob Wallace</b> — what are they known for?
    back: |-
      The modern economics of <b>Medicaid managed care</b>: plan effects identified from quasi-random auto-assignment, risk adjustment and selection, and rationing in public insurance programs.
    extra: |-
      This group's contribution is showing that <i>which plan</i> a Medicaid enrollee is assigned to causally affects their spending and care — which makes auto-assignment algorithms and plan quality measurement real policy levers rather than administrative trivia.

  - id: P014
    tags: [economists, critics]
    front: |-
      <b>Robert Kaestner</b> — what position does he occupy in the literature?
    back: |-
      Health economist (University of Chicago Harris) known for <b>methodologically skeptical</b> reassessments of coverage expansion findings — questioning the robustness of mortality estimates and examining labor supply effects carefully.
    extra: |-
      Worth reading precisely because he pushes on results that are politically convenient to accept. A literature where nobody plays this role is a literature you should not fully trust.

  - id: P015
    tags: [economists, labor]
    front: |-
      <b>Laura Dague</b> — what is she known for?
    back: |-
      Texas A&M economist; work on <b>public insurance and labor supply</b> using Wisconsin's BadgerCare enrollment caps and waiting lists, finding larger employment effects than most ACA expansion studies.
    extra: |-
      Also works on Medicaid and criminal justice involvement, and on churn. Her BadgerCare work is the most important counterweight to the "Medicaid has no labor supply effect" summary.

  - id: P016
    tags: [economists, behavioral-health]
    front: |-
      <b>Johanna Catherine Maclean</b> — what is she known for?
    back: |-
      Health economist working on <b>substance use disorder treatment and behavioral health</b>, including the effects of Medicaid expansion on SUD treatment and medications for opioid use disorder.
    extra: |-
      The go-to author for the intersection of Medicaid policy and the overdose crisis — a connection that matters because Medicaid is the largest payer for SUD treatment.

  - id: P017
    tags: [economists, measurement]
    front: |-
      <b>Bruce Meyer</b> — what is he known for that matters for benefit evaluation?
    back: |-
      Chicago Harris economist; the leading work on <b>measurement error in survey reporting of program participation</b> — showing that survey respondents substantially underreport receipt of Medicaid, SNAP, and other transfers, which biases poverty and take-up estimates.
    extra: |-
      Directly relevant to any evaluation using survey data: the "Medicaid undercount" means survey-based coverage and take-up figures are systematically wrong in a known direction. Also a co-author on the Wherry-Meyer teen mortality RD.

  - id: P018
    tags: [economists, take-up]
    front: |-
      <b>Anna Aizer</b> — what is she known for?
    back: |-
      Brown University economist; work showing that <b>outreach and application assistance</b> increase Medicaid take-up among eligible children and reduce avoidable hospitalizations.
    extra: |-
      An early and clean demonstration that enrollment friction — not eligibility rules or benefit generosity — is often the binding constraint on program reach.

  - id: P019
    tags: [economists, safety-net]
    front: |-
      <b>Hilary Hoynes</b>, <b>Diane Whitmore Schanzenbach</b>, and <b>Marianne Bitler</b> — why do they matter for Medicaid evaluation?
    back: |-
      They built the modern evidence base on the <b>long-run effects of the safety net</b> — largely through SNAP, the EITC, and food programs — establishing the methods and the framing (early-life exposure, long-run administrative follow-up, cost-benefit over decades) that the childhood Medicaid literature uses.
    extra: |-
      If your work is on benefit evaluation broadly rather than Medicaid alone, this group is as important as the Medicaid specialists. Hoynes and Schanzenbach's food stamp rollout work is the direct methodological template for Goodman-Bacon's Medicaid introduction papers.

  # --- Law, politics, administration ---------------------------------------

  - id: P020
    priority: 1
    tags: [law]
    front: |-
      <b>Sara Rosenbaum</b> — what is she known for?
    back: |-
      George Washington University; the leading <b>health law scholar on Medicaid</b> — statutory interpretation, beneficiary rights, EPSDT, managed care regulation, and the legal analysis of waiver authority.
    extra: |-
      When a Medicaid question is legal rather than empirical, her work is the reference. Prolific in Health Affairs Forefront and Milbank commentary, so her analysis is usually available quickly after a legal development.

  - id: P021
    tags: [law]
    front: |-
      <b>Nicole Huberfeld</b> — what is she known for?
    back: |-
      Boston University health law scholar; <b>Medicaid federalism and constitutional law</b> — the spending clause questions in <i>NFIB v. Sebelius</i>, the limits of waiver authority, and how federalism shapes health coverage.
    extra: |-
      The right author for understanding why Medicaid's structure produces the legal fights it does, rather than just what the current doctrine says.

  - id: P022
    priority: 1
    tags: [political-science]
    front: |-
      <b>Jamila Michener</b> — what is she known for?
    back: |-
      Cornell political scientist; <b><i>Fragmented Democracy: Medicaid, Federalism, and Unequal Politics</i></b> — showing that Medicaid's decentralized structure shapes recipients' political participation and sense of citizenship, generally depressing both.
    extra: |-
      The central argument for anyone doing benefit evaluation: programs do not only deliver benefits, they teach recipients what government is and what they can expect from it. Policy feedback effects belong in an evaluation's outcome set.

  - id: P023
    tags: [political-science]
    front: |-
      <b>Colleen Grogan</b> — what is she known for?
    back: |-
      University of Chicago; the <b>political history of Medicaid</b>, including <i>Grow and Hide</i> — an account of how the American health system expanded public financing while obscuring its public character.
    extra: |-
      Useful corrective to purely economic framings: it explains why Medicaid grew so large while remaining politically vulnerable, and why "public" spending is routinely mistaken for private.

  - id: P024
    tags: [political-science]
    front: |-
      <b>Frank Thompson</b> — what is he known for?
    back: |-
      Rutgers; <b>Medicaid politics and executive federalism</b> — how waivers and administrative action, rather than legislation, have driven most of Medicaid's evolution, and how that shifts with each administration.
    extra: |-
      The best account of why 1115 authority ended up doing so much of the work of national health policy, and what that means for policy durability.

  - id: P025
    priority: 1
    tags: [administrative-burden]
    front: |-
      <b>Pamela Herd</b> and <b>Donald Moynihan</b> — what are they known for?
    back: |-
      <b><i>Administrative Burden: Policymaking by Other Means</i></b> — the framework dividing burden into <b>learning</b>, <b>compliance</b>, and <b>psychological</b> costs, and the argument that burdens are chosen, not inevitable, and often function as covert policy.
    extra: |-
      Indispensable for benefit evaluation. It reframes take-up failure from a recipient problem into a design problem, and gives you a vocabulary for measuring the thing that turned out to drive both the Arkansas work requirement outcome and the unwinding.

  - id: P026
    tags: [policy-analysts]
    front: |-
      <b>Joan Alker</b> — what is she known for?
    back: |-
      Georgetown University Center for Children and Families; the leading tracker of <b>children's coverage</b> — annual reports on children's uninsurance, CHIP, and the effects of eligibility and enrollment policy on kids.
    extra: |-
      CCF's annual children's uninsured report is the standard citation on child coverage trends, and their state-level data are usually first out after a policy change.

  - id: P027
    tags: [policy-analysts]
    front: |-
      <b>Robin Rudowitz</b> — what is she known for?
    back: |-
      Directs KFF's Medicaid program; co-author of the annual <b>Medicaid Budget Survey</b> (conducted with state Medicaid directors) and much of KFF's Medicaid policy analysis.
    extra: |-
      The Budget Survey is the best available read on what states are actually doing and expecting, ahead of official data. If you need current-year enrollment and spending direction, this is the source.

  - id: P028
    tags: [policy-analysts, critics]
    front: |-
      <b>Brian Blase</b> — what position does he occupy?
    back: |-
      President of the Paragon Health Institute and a former Trump administration health policy official; the most prominent <b>market-oriented critic</b> of Medicaid expansion — focused on improper payments, the enhanced match rate's distortions, enrollment of ineligible people, and provider tax financing.
    extra: |-
      Read to understand the intellectual case behind recent restrictive legislation, and to stress-test expansion arguments. Note that his improper payment claims often rest on the PERM rate, which measures documentation error rather than fraud — a specific point worth being able to make precisely.

  - id: P029
    tags: [researchers, coverage]
    front: |-
      <b>Adrianna McIntyre</b>, <b>Jamie Daw</b>, and <b>Chima Ndumele</b> — what do they work on?
    back: |-
      - <b>McIntyre</b> (Harvard) — Medicaid policy and politics, churn, coverage transitions, and public understanding of coverage
      - <b>Daw</b> (Columbia) — postpartum and maternal Medicaid coverage, insurance churn around pregnancy
      - <b>Ndumele</b> (Yale) — Medicaid managed care, churn, and equity in coverage
    extra: |-
      A useful cluster: all three work on <b>continuity</b> — who loses coverage, when, and why — which is the most policy-actionable margin in Medicaid right now.

  - id: P030
    tags: [researchers, oregon]
    front: |-
      <b>Heidi Allen</b> — what is she known for?
    back: |-
      Columbia School of Social Work; a member of the Oregon Health Insurance Experiment team, and known for combining survey and <b>qualitative</b> research on what coverage and coverage loss actually mean to enrollees.
    extra: |-
      A useful reminder that the Oregon study included investigators trained outside economics. For evaluation work, her research is a model of pairing administrative estimates with an account of mechanism.

  # --- Institutions --------------------------------------------------------

  - id: P031
    priority: 1
    tags: [institutions]
    front: |-
      <b>MACPAC</b> — what is it and what does it produce?
    back: |-
      The Medicaid and CHIP Payment and Access Commission — a nonpartisan legislative branch agency advising Congress. Produces the <b>MACStats data book</b>, March and June reports to Congress, and issue briefs.
    extra: |-
      Created by CHIPRA in 2009; the Medicaid counterpart to MedPAC. MACStats is the most citable single source of Medicaid statistics. Public commission meetings are also a good early read on where federal policy thinking is going.

  - id: P032
    priority: 1
    tags: [institutions]
    front: |-
      <b>KFF</b> — what is it and what is it good for?
    back: |-
      An independent health policy research and polling organization (formerly the Kaiser Family Foundation, unaffiliated with Kaiser Permanente). Best for <b>State Health Facts</b>, the annual Medicaid Budget Survey, fast explainers on new legislation, and 50-state policy trackers.
    extra: |-
      The workhorse source for current state-level policy detail. Note that it publishes analysis rather than peer-reviewed research — excellent for facts and framing, and it should be cited as such rather than as a study.

  - id: P033
    tags: [institutions]
    front: |-
      <b>CBO</b> and <b>GAO</b> — what does each contribute to Medicaid policy debate?
    back: |-
      - <b>CBO</b> — baseline projections and cost estimates for proposed legislation, including coverage-loss estimates; its scores set the terms of every reconciliation fight
      - <b>GAO</b> — audits and evaluations of program operations, financing arrangements, waiver oversight, and improper payments
    extra: |-
      GAO has been persistently critical of CMS's oversight of supplemental payments, provider taxes, and 1115 budget neutrality — a reliable source of documented, specific problems in program administration.

  - id: P034
    tags: [institutions]
    front: |-
      Which think tanks and policy organizations shape Medicaid debate, and from what direction?
    back: |-
      - <b>Left / pro-coverage</b>: Center on Budget and Policy Priorities (CBPP), Georgetown CCF, Commonwealth Fund, Urban Institute (technically nonpartisan, empirically oriented)
      - <b>Right / market-oriented</b>: Paragon Health Institute, AEI, Cato, Manhattan Institute, Mercatus
      - <b>State-facing / nonpartisan</b>: NASHP, NAMD, CHCS, Milbank Memorial Fund
    extra: |-
      Knowing the direction is not a reason to dismiss the work — it is a reason to check which assumptions are doing the work in an estimate. The state-facing organizations are the least ideological and the most useful for how things actually operate.

  - id: P035
    tags: [institutions, evaluators]
    front: |-
      Which organizations actually conduct Medicaid demonstration evaluations?
    back: |-
      <b>Mathematica</b>, <b>RTI International</b>, <b>Abt Global</b>, <b>Urban Institute</b>, <b>NORC</b>, and academic centers under contract to states or CMS.
    extra: |-
      Worth knowing if you work in evaluation: these are the shops that hold the federal and state contracts, their reports are public, and their methods appendices are often more informative than the published summaries. Mathematica in particular has done much of the federal LTSS and demonstration evaluation work.

  - id: P036
    tags: [institutions, government]
    front: |-
      Which parts of the federal government produce Medicaid evidence?
    back: |-
      - <b>CMS / CMCS</b> — program data, waiver documents, expenditure reports
      - <b>CMS Office of the Actuary</b> — the annual Actuarial Report on Medicaid, projections
      - <b>CMMI</b> (Innovation Center) — payment and delivery model tests and their evaluations
      - <b>ASPE</b> — HHS's policy research and evaluation office
      - <b>AHRQ</b> — health services research, MEPS, quality indicators
    extra: |-
      ASPE is the one most people miss. It commissions and publishes a great deal of coverage and access research, and it is where much government-side health policy analysis is produced.

  # --- Journals and venues -------------------------------------------------

  - id: P037
    priority: 1
    tags: [journals]
    front: |-
      Which journals publish the strongest causal Medicaid research?
    back: |-
      - <b>General economics</b>: QJE, AER, JPE, Review of Economic Studies, Review of Economics and Statistics
      - <b>Field economics</b>: Journal of Health Economics, AEJ: Economic Policy, Journal of Public Economics, American Journal of Health Economics
      - <b>Policy</b>: Journal of Policy Analysis and Management (JPAM)
    extra: |-
      The general economics journals publish the highest-profile identification-driven papers (Oregon, mortality, long-run childhood effects). The field journals carry the bulk of the literature and are where you go for depth on a specific question.

  - id: P038
    tags: [journals]
    front: |-
      Which medical and health services journals matter for Medicaid, and how do they differ?
    back: |-
      - <b>NEJM</b>, <b>JAMA</b>, <b>Annals of Internal Medicine</b> — high visibility, clinical audience, shorter formats; where a major finding goes to reach physicians and press
      - <b>JAMA Health Forum</b>, <b>JAMA Internal Medicine</b> — health policy research, faster turnaround
      - <b>Health Affairs</b> — the dominant policy journal; strong on descriptive and state-level work
      - <b>Health Services Research</b>, <b>Medical Care</b>, <b>Milbank Quarterly</b>, <b>JHPPL</b> — HSR methods, delivery, and politics
    extra: |-
      Practical difference: economics journals impose long review and demand identification; medical and policy journals publish faster with tighter word limits, so methods detail is often in an appendix or absent. Adjust your scrutiny accordingly rather than your respect.

  - id: P039
    tags: [journals, preprints]
    front: |-
      Where does Medicaid research appear before publication?
    back: |-
      <b>NBER working papers</b> (health care and public economics programs) — the main venue, typically one to three years ahead of journal publication. Also SSRN, and conference programs for <b>ASHEcon</b>, <b>APPAM</b>, and the AcademyHealth Annual Research Meeting.
    extra: |-
      If you follow only one thing to stay current, follow the NBER health care working paper series. Caveat: working papers are not peer reviewed, results change between the working paper and the published version, and the change is sometimes substantial.

  - id: P040
    tags: [sources, practice]
    front: |-
      What should you read to keep current on Medicaid <i>policy</i> as opposed to research?
    back: |-
      - <b>Health Affairs Forefront</b> — fast expert commentary
      - <b>KFF</b> daily health policy news and issue briefs
      - <b>Federal Register</b> for proposed and final rules, and Medicaid.gov for waiver approvals
      - <b>MACPAC</b> public meeting materials
      - <b>Georgetown CCF's Say Ahhh! blog</b> for children's coverage
      - State Medicaid agency public notices and NAMD material for operational reality
    extra: |-
      The gap between research and policy time is the practical problem in this field: rules take effect years before the evaluation lands. Reading both streams is the only way to know which questions are about to matter.

  # --- Reading practice ----------------------------------------------------

  - id: P041
    priority: 1
    tags: [practice]
    front: |-
      Why is it worth tracking authors rather than only topics?
    back: |-
      Because research programs are cumulative. Knowing that Miller and Wherry work on early-life Medicaid means a new paper of theirs is immediately locatable in a body of work with known methods, known data, and known priors — and you can see whether a new result extends or contradicts their own earlier findings.
    extra: |-
      It also protects against citation laundering: a striking claim circulating without an author you recognize is worth tracing to its source before repeating.

  - id: P042
    tags: [practice]
    front: |-
      What should you check about an author or organization before weighting their finding?
    back: |-
      - Funding source and disclosure statement
      - Whether the work is peer reviewed, a working paper, or advocacy analysis
      - Whether they have published results cutting against their apparent priors
      - Whether the piece reports its own limitations and precision, or only its headline
    extra: |-
      The third is the most informative. Researchers who have published inconvenient results have demonstrated something about their process that no methods section can establish on its own.

  - id: P043
    tags: [practice]
    front: |-
      What distinguishes an advocacy analysis from a research finding, when both are numerate?
    back: |-
      Advocacy analysis selects the specification, comparison, and framing that best supports a conclusion, and typically reports one number without a confidence interval or a sensitivity analysis. Research reports the specification space and shows where the result breaks.
    extra: |-
      This is not a reason to ignore advocacy analysis — it is frequently accurate and always faster. It is a reason to look for the sensitivity analysis before you repeat the number, and to expect that you will have to reconstruct it yourself.
