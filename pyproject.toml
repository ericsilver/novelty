[project]
name = "novelty"
version = "0.0.1"
description = "DeDeo KL surprise on USPTO trademark descriptions to classify innovators vs derivative/tired filings."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.1",
    "pyarrow>=15.0",
    "polars>=1.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
